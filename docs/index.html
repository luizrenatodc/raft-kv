<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>raft-kv · replay</title>
<style>
:root{--bg:#0d1117;--pn:#151b23;--ln:#2a313c;--tx:#e6edf3;--mt:#8b98a8;--ld:#7cc4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 16px}h1{font-size:26px;margin:0}p{color:var(--mt);margin:6px 0 20px}
.g{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}@media(max-width:860px){.g{grid-template-columns:1fr}}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mt);margin:0 0 10px}
svg{width:100%;height:auto;display:block}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mt);text-align:left;font-weight:500}td,th{padding:6px 4px;border-bottom:1px solid var(--ln)}
.b{height:8px;background:#222a35;border-radius:4px;position:relative;min-width:80px}.b i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.ct{display:flex;gap:12px;align-items:center;margin-top:16px}input[type=range]{flex:1;accent-color:var(--ld)}
button{background:var(--ld);color:#06121f;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;min-width:84px}
#ev{list-style:none;margin:0;padding:0;height:210px;overflow:auto;font-size:13px}#ev li{padding:4px 0;border-bottom:1px solid var(--ln);color:var(--mt)}#ev b{color:var(--tx);font-weight:500}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.k div{font-size:12px;color:var(--mt)}.k b{display:block;font-size:20px;color:var(--tx)}
</style></head><body><main>
<h1>raft-kv · replay de uma execução</h1>
<p>Execução real do simulador, semente <span id="sem"></span>. Quedas, perdas e partições vêm da semente, então este replay é reproduzível.</p>
<div class="g"><section class="c"><h2>Cluster · tempo <span id="t"></span></h2><svg id="m" viewBox="0 0 560 400" role="img" aria-label="Nós do cluster e mensagens"></svg></section>
<div style="display:grid;gap:16px"><section class="c"><h2>Estado dos nós</h2><table><thead><tr><th>Nó</th><th>Papel</th><th>Termo</th><th>Log</th><th>Commit</th></tr></thead><tbody id="tb"></tbody></table>
<div class="k" id="k"></div></section><section class="c"><h2>Eventos</h2><ul id="ev"></ul></section></div></div>
<div class="ct"><button id="p">Pausar</button><input id="s" type="range" min="0" value="0" aria-label="Linha do tempo"></div>
</main><script src="execucao.js"></script><script>
const E=window.EXECUCAO,Q=E.quadros,$=i=>document.getElementById(i);$("sem").textContent=E.semente;$("s").max=Q.length-1;
const cor={lider:"#7cc4ff",candidato:"#ffb454","pre-candidato":"#d8b86a",seguidor:"#5fd38d",fora:"#4a5361"};
const pos=i=>{const a=-Math.PI/2+i*2*Math.PI/5;return[280+150*Math.cos(a),200+150*Math.sin(a)]};
const mc={anexar:"#7cc4ff",anexado:"#3f6f97",pedeVoto:"#ffb454",voto:"#a98545"};
function desenhar(i){const q=Q[i];$("t").textContent=q.t;let s="";
const part=new Set(q.nos.map(n=>n.grupo)).size>1;
for(const m of q.msgs){const[a,b]=pos(m.de),[c,d]=pos(m.para);s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${mc[m.tipo]}" stroke-width="1.5" opacity=".75"/>`}
for(const n of q.nos){const[x,y]=pos(n.id);s+=`<circle cx="${x}" cy="${y}" r="38" fill="#10161e" stroke="${cor[n.papel]}" stroke-width="${n.papel=="lider"?4:2}" ${part&&n.grupo?'stroke-dasharray="6 4"':''}/><text x="${x}" y="${y-2}" fill="#e6edf3" text-anchor="middle" font-size="19" font-weight="600">${n.id}</text><text x="${x}" y="${y+16}" fill="#8b98a8" text-anchor="middle" font-size="9.5">${n.papel}</text>`}
s+=`<text x="280" y="196" fill="#8b98a8" text-anchor="middle" font-size="13">${part?"rede partida":"rede inteira"}</text>`;if(part)s+=`<text x="280" y="216" fill="#8b98a8" text-anchor="middle" font-size="12">tracejado = outro lado</text>`;$("m").innerHTML=s;
const mx=Math.max(1,...q.nos.map(n=>n.log));
$("tb").innerHTML=q.nos.map(n=>`<tr><td>${n.id}</td><td style="color:${cor[n.papel]}">${n.papel}</td><td>${n.termo}</td><td><div class="b"><i style="width:${n.log/mx*100}%;background:#3f6f97"></i><i style="width:${n.commit/mx*100}%;background:#5fd38d"></i></div></td><td>${n.commit}</td></tr>`).join("");
const v=Q.slice(0,i+1).filter(x=>x.evento).slice(-30).reverse();$("ev").innerHTML=v.map(x=>`<li>t=${x.t} · <b>${x.evento}</b></li>`).join("");
const M=E.metricas;$("k").innerHTML=[["eleições",M.eleicoes],["quedas",M.quedas],["partições",M.particoes],["ops concluídas",M.concluidas]].map(([a,b])=>`<div><b>${b}</b>${a}</div>`).join("");$("s").value=i}
let i=0,on=!matchMedia("(prefers-reduced-motion: reduce)").matches;$("p").textContent=on?"Pausar":"Tocar";
$("p").onclick=()=>{on=!on;$("p").textContent=on?"Pausar":"Tocar"};$("s").oninput=e=>{i=+e.target.value;desenhar(i)};
const h=new URLSearchParams(location.search).get("q");if(h){i=+h;on=false;$("p").textContent="Tocar"}desenhar(i);setInterval(()=>{if(on){i=(i+1)%Q.length;desenhar(i)}},70);
</script></body></html>
